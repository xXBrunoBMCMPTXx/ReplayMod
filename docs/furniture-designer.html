<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Móveis CAD</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --muted: #94a3b8;
      --accent: #22c55e;
      --line: #1f2937;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    .sidebar {
      background: rgba(15, 23, 42, 0.9);
      border-right: 1px solid var(--line);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    h1 {
      font-size: 1.2rem;
      margin: 0;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .block {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      font-size: 0.8rem;
      color: var(--muted);
      display: grid;
      gap: 4px;
    }

    input, select, button {
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1220;
      color: var(--text);
      padding: 9px;
      font-size: 0.9rem;
    }

    button {
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
      background: #1e293b;
    }

    button:hover { transform: translateY(-1px); }

    .primary {
      background: linear-gradient(120deg, #16a34a, var(--accent));
      color: #052e16;
      font-weight: 700;
      border: none;
    }

    .danger { background: #7f1d1d; border-color: #ef4444; }

    .workspace {
      padding: 16px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .toolbar {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .canvas-wrap {
      background: #060b16;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      min-height: 620px;
      background-image:
        linear-gradient(0deg, rgba(51, 65, 85, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(51, 65, 85, 0.35) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: -1px -1px;
    }

    .tag {
      color: #cbd5e1;
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
    }

    @media (max-width: 980px) {
      body { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
      canvas { min-height: 420px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1>🪑 Studio Móveis CAD</h1>
    <p class="hint">Cria, move e personaliza móveis em planta 2D. Clica num móvel para editar medidas, cor, rotação e preço.</p>

    <section class="block">
      <strong>Novo móvel</strong>
      <label>Tipo
        <select id="type">
          <option value="Sofá">Sofá</option>
          <option value="Mesa">Mesa</option>
          <option value="Cama">Cama</option>
          <option value="Roupeiro">Roupeiro</option>
          <option value="Móvel TV">Móvel TV</option>
          <option value="Personalizado">Personalizado</option>
        </select>
      </label>
      <div class="row">
        <label>Largura (cm)
          <input id="width" type="number" min="30" value="180" />
        </label>
        <label>Altura (cm)
          <input id="height" type="number" min="30" value="90" />
        </label>
      </div>
      <div class="row">
        <label>Cor
          <input id="color" type="color" value="#4ade80" />
        </label>
        <label>Preço (€)
          <input id="price" type="number" min="0" value="399" />
        </label>
      </div>
      <button id="add" class="primary">Adicionar ao projeto</button>
    </section>

    <section class="block">
      <strong>Editar seleção</strong>
      <div class="row">
        <label>X
          <input id="selX" type="number" />
        </label>
        <label>Y
          <input id="selY" type="number" />
        </label>
      </div>
      <div class="row">
        <label>Largura
          <input id="selW" type="number" min="10" />
        </label>
        <label>Altura
          <input id="selH" type="number" min="10" />
        </label>
      </div>
      <div class="row">
        <label>Rotação (°)
          <input id="selRot" type="number" min="0" max="359" />
        </label>
        <label>Cor
          <input id="selColor" type="color" />
        </label>
      </div>
      <div class="row">
        <button id="duplicate">Duplicar</button>
        <button id="remove" class="danger">Remover</button>
      </div>
    </section>

    <section class="block">
      <strong>Projeto</strong>
      <div class="row">
        <button id="export">Exportar JSON</button>
        <button id="clear">Limpar tudo</button>
      </div>
      <span class="tag" id="summary">0 móveis • Total €0</span>
    </section>
  </aside>

  <main class="workspace">
    <div class="toolbar">
      <span class="tag">Arrastar: mover</span>
      <span class="tag">Rodinha do rato: rodar</span>
      <span class="tag">Setas: ajuste fino</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="board" width="1400" height="850"></canvas>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');

    const state = {
      items: [],
      selectedId: null,
      dragging: false,
      dragOffset: { x: 0, y: 0 }
    };

    const input = (id) => document.getElementById(id);

    const controls = {
      type: input('type'), width: input('width'), height: input('height'), color: input('color'), price: input('price'),
      selX: input('selX'), selY: input('selY'), selW: input('selW'), selH: input('selH'), selRot: input('selRot'), selColor: input('selColor'),
      summary: input('summary')
    };

    const uid = () => Math.random().toString(36).slice(2, 9);

    function selected() {
      return state.items.find((i) => i.id === state.selectedId) || null;
    }

    function addItem() {
      const item = {
        id: uid(),
        type: controls.type.value,
        x: 110 + state.items.length * 28,
        y: 100 + state.items.length * 22,
        w: Number(controls.width.value),
        h: Number(controls.height.value),
        color: controls.color.value,
        rot: 0,
        price: Number(controls.price.value)
      };
      state.items.push(item);
      state.selectedId = item.id;
      draw();
      syncSelectionPanel();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      state.items.forEach((item) => {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rot * Math.PI / 180);

        ctx.fillStyle = item.color;
        ctx.strokeStyle = item.id === state.selectedId ? '#f8fafc' : '#0b1220';
        ctx.lineWidth = item.id === state.selectedId ? 4 : 2;

        ctx.fillRect(-item.w / 2, -item.h / 2, item.w, item.h);
        ctx.strokeRect(-item.w / 2, -item.h / 2, item.w, item.h);

        ctx.fillStyle = '#0b1220';
        ctx.font = 'bold 16px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(item.type, 0, 6);
        ctx.restore();
      });

      const total = state.items.reduce((sum, i) => sum + (i.price || 0), 0);
      controls.summary.textContent = `${state.items.length} móveis • Total €${total}`;
    }

    function pointInsideItem(px, py, item) {
      const dx = px - item.x;
      const dy = py - item.y;
      const angle = -item.rot * Math.PI / 180;
      const rx = dx * Math.cos(angle) - dy * Math.sin(angle);
      const ry = dx * Math.sin(angle) + dy * Math.cos(angle);
      return Math.abs(rx) <= item.w / 2 && Math.abs(ry) <= item.h / 2;
    }

    function pickItem(x, y) {
      for (let i = state.items.length - 1; i >= 0; i -= 1) {
        if (pointInsideItem(x, y, state.items[i])) return state.items[i];
      }
      return null;
    }

    function syncSelectionPanel() {
      const item = selected();
      const fields = [controls.selX, controls.selY, controls.selW, controls.selH, controls.selRot, controls.selColor];
      if (!item) {
        fields.forEach((f) => f.value = '');
        return;
      }
      controls.selX.value = Math.round(item.x);
      controls.selY.value = Math.round(item.y);
      controls.selW.value = Math.round(item.w);
      controls.selH.value = Math.round(item.h);
      controls.selRot.value = item.rot;
      controls.selColor.value = item.color;
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);

      const hit = pickItem(x, y);
      state.selectedId = hit?.id || null;

      if (hit) {
        state.dragging = true;
        state.dragOffset = { x: x - hit.x, y: y - hit.y };
      }

      syncSelectionPanel();
      draw();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!state.dragging) return;
      const item = selected();
      if (!item) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      item.x = x - state.dragOffset.x;
      item.y = y - state.dragOffset.y;
      syncSelectionPanel();
      draw();
    });

    ['mouseup', 'mouseleave'].forEach((ev) => canvas.addEventListener(ev, () => { state.dragging = false; }));

    canvas.addEventListener('wheel', (e) => {
      const item = selected();
      if (!item) return;
      e.preventDefault();
      item.rot = (item.rot + (e.deltaY > 0 ? 5 : -5) + 360) % 360;
      syncSelectionPanel();
      draw();
    }, { passive: false });

    [controls.selX, controls.selY, controls.selW, controls.selH, controls.selRot, controls.selColor].forEach((el) => {
      el.addEventListener('input', () => {
        const item = selected();
        if (!item) return;
        item.x = Number(controls.selX.value || item.x);
        item.y = Number(controls.selY.value || item.y);
        item.w = Math.max(10, Number(controls.selW.value || item.w));
        item.h = Math.max(10, Number(controls.selH.value || item.h));
        item.rot = (Number(controls.selRot.value || item.rot) + 360) % 360;
        item.color = controls.selColor.value || item.color;
        draw();
      });
    });

    document.addEventListener('keydown', (e) => {
      const item = selected();
      if (!item) return;
      const step = e.shiftKey ? 10 : 2;
      if (e.key === 'ArrowLeft') item.x -= step;
      if (e.key === 'ArrowRight') item.x += step;
      if (e.key === 'ArrowUp') item.y -= step;
      if (e.key === 'ArrowDown') item.y += step;
      syncSelectionPanel();
      draw();
    });

    input('add').addEventListener('click', addItem);

    input('remove').addEventListener('click', () => {
      if (!state.selectedId) return;
      state.items = state.items.filter((i) => i.id !== state.selectedId);
      state.selectedId = null;
      syncSelectionPanel();
      draw();
    });

    input('duplicate').addEventListener('click', () => {
      const item = selected();
      if (!item) return;
      const clone = { ...item, id: uid(), x: item.x + 20, y: item.y + 20 };
      state.items.push(clone);
      state.selectedId = clone.id;
      syncSelectionPanel();
      draw();
    });

    input('clear').addEventListener('click', () => {
      state.items = [];
      state.selectedId = null;
      syncSelectionPanel();
      draw();
    });

    input('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state.items, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'projeto-moveis.json';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    addItem();
    addItem();
  </script>
</body>
</html>
