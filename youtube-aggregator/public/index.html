<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Aggregator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
    }

    header {
      background: #1a1a1a;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 20px;
      color: #ff4444;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 .logo {
      width: 28px;
      height: 20px;
      background: #ff4444;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header h1 .logo::after {
      content: "";
      border-left: 8px solid white;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }

    .admin-link {
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      border: 1px solid #444;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .admin-link:hover {
      color: #fff;
      border-color: #888;
      background: #2a2a2a;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #888;
    }

    .empty-state h2 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #aaa;
    }

    .empty-state p { margin-bottom: 20px; }

    .empty-state a {
      color: #ff4444;
      text-decoration: none;
      font-weight: 600;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .video-card a {
      text-decoration: none;
      color: inherit;
    }

    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #222;
    }

    .thumbnail-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-info {
      padding: 12px 16px 16px;
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta {
      font-size: 12px;
      color: #aaa;
    }

    .video-meta .channel-name {
      color: #ccc;
      font-weight: 500;
    }

    .video-meta .date {
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="logo"></span> YouTube Aggregator</h1>
    <a href="admin.html" class="admin-link">Manage Channels</a>
  </header>

  <div class="container">
    <div id="content">
      <div class="loading">Loading latest videos...</div>
    </div>
  </div>

  <script>
    async function loadVideos() {
      const content = document.getElementById("content");
      try {
        const res = await fetch("/api/videos");
        const videos = await res.json();

        if (videos.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <h2>No videos yet</h2>
              <p>Add some YouTube channels to get started.</p>
              <a href="admin.html">Go to Manage Channels</a>
            </div>`;
          return;
        }

        const grid = document.createElement("div");
        grid.className = "video-grid";

        for (const video of videos) {
          const date = new Date(video.published);
          const timeAgo = getTimeAgo(date);

          const card = document.createElement("div");
          card.className = "video-card";
          card.innerHTML = `
            <a href="${video.link}" target="_blank" rel="noopener">
              <div class="thumbnail-wrapper">
                <img src="${video.thumbnail}" alt="" loading="lazy">
              </div>
              <div class="video-info">
                <div class="video-title">${escapeHtml(video.title)}</div>
                <div class="video-meta">
                  <div class="channel-name">${escapeHtml(video.channelName)}</div>
                  <div class="date">${timeAgo}</div>
                </div>
              </div>
            </a>`;
          grid.appendChild(card);
        }

        content.innerHTML = "";
        content.appendChild(grid);
      } catch (err) {
        content.innerHTML = `<div class="empty-state"><h2>Error loading videos</h2><p>${err.message}</p></div>`;
      }
    }

    function getTimeAgo(date) {
      const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
      const intervals = [
        { label: "year", seconds: 31536000 },
        { label: "month", seconds: 2592000 },
        { label: "week", seconds: 604800 },
        { label: "day", seconds: 86400 },
        { label: "hour", seconds: 3600 },
        { label: "minute", seconds: 60 },
      ];
      for (const { label, seconds: s } of intervals) {
        const count = Math.floor(seconds / s);
        if (count >= 1) return `${count} ${label}${count > 1 ? "s" : ""} ago`;
      }
      return "Just now";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadVideos();
  </script>
</body>
</html>
